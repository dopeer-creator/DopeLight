[project]
name = "relight-backend"
version = "0.1.0"
description = "Local inference backend for the Relight desktop app"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.20",
    "numpy>=2.0",
    "pillow>=11.0",
    "opencv-python-headless>=4.10",
    "huggingface-hub>=1.0",
    "safetensors>=0.5",
    "transformers>=5.0",
    "diffusers>=0.40",
    "accelerate>=1.10",
    # BiRefNet's model code (loaded from its Hugging Face repo) imports these.
    "timm>=1.0",
    "kornia>=0.8",
    "einops>=0.8",
    # DSINE's encoder is built with geffnet.
    "geffnet>=1.0.2",
]

# torch comes from a different wheel index per machine. Pick exactly one extra:
#   uv sync --extra cpu      (no NVIDIA GPU; slow, for development)
#   uv sync --extra cu126    (NVIDIA GPU, CUDA 12.6 build)
# scripts/setup-backend.mjs picks it automatically.
[project.optional-dependencies]
cpu = ["torch>=2.14,<2.15", "torchvision>=0.29,<0.30"]
cu126 = ["torch>=2.14,<2.15", "torchvision>=0.29,<0.30"]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu126" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu126" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu126" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["slow: needs downloaded model weights (run with -m slow)"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["relight_backend"]

# Libraries without usable type information.
[[tool.mypy.overrides]]
module = ["transformers.*", "diffusers.*", "torchvision.*", "geffnet.*", "models.*", "stablenormal.*"]
ignore_missing_imports = true

# Model wrappers call into those untyped libraries all the time.
[[tool.mypy.overrides]]
module = ["relight_backend.models.*", "relight_backend.utils.fetch_weights"]
disallow_untyped_calls = false
warn_return_any = false
